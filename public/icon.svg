<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="75%">
      <stop offset="0" stop-color="#10204a"/>
      <stop offset="0.6" stop-color="#081030"/>
      <stop offset="1" stop-color="#050816"/>
    </radialGradient>
    <linearGradient id="ramp" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7ff3ff"/>
      <stop offset="0.6" stop-color="#b69bff"/>
      <stop offset="1" stop-color="#ff9ad5"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="9" result="b"/>

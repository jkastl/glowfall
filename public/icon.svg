    <path d="M362 318 C 290 330, 220 345, 140 382" stroke="url(#ramp)" stroke-width="13"/>
  </g>
  <g filter="url(#soft)" opacity="0.55">
    <circle cx="214" cy="204" r="30" fill="#b18cff"/>
    <circle cx="302" cy="226" r="30" fill="#5ff0b0"/>
    <circle cx="248" cy="308" r="30" fill="#ff7cc4"/>
    <circle cx="184" cy="332" r="30" fill="#ffc14d"/>
  </g>
  <g filter="url(#glow)">
    <circle cx="256" cy="140" r="26" fill="#d9fbff"/>
    <circle cx="214" cy="204" r="21" fill="#c9a8ff"/>
    <circle cx="302" cy="226" r="21" fill="#9ff7d0"/>
    <circle cx="248" cy="308" r="21" fill="#ffb3dc"/>
    <circle cx="184" cy="332" r="21" fill="#ffd88a"/>
